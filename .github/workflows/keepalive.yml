# Supabase Free プランの一時停止対策（週1回 DB に到達させる）
#
# ★ テーブルを SELECT する方式にしていたが、RLSポリシーを変えると結果が変わりうる
#   （実際 profiles の "family read" を廃止した）。
#   RLSから独立した public.ping()（security definer）を呼ぶ方式に変更した。
#   → migration 20260726000003_usage_units.sql で定義
name: keepalive
on:
  schedule:
    - cron: "0 3 * * 1"   # 毎週月曜 03:00 UTC
  workflow_dispatch:      # セットアップ直後に手動で1回実行して疎通を確認すること

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          res=$(curl -s -w "\n%{http_code}" -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping")
          code=$(echo "$res" | tail -n1)
          body=$(echo "$res" | sed '$d')
          echo "HTTP $code"
          echo "body: $body"
          if [ "$code" != "200" ]; then
            echo "::error::keepalive に失敗しました。Secrets の値と、migration 3本目（public.ping）が適用済みか確認してください"
            exit 1
          fi
