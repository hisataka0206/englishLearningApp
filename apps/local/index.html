// ---- 録音して発音チェック（Azure Pronunciation Assessment） ----
let mediaRec = null, recChunks = [], recTimer = null, recStart = 0;
const REC_LIMIT_SEC = 55;  // Azure短音声APIの上限（約60秒）に合わせた自動停止

async function toggleRecord() {
  const btn = document.getElementById("btnRec");
  if (mediaRec && mediaRec.state === "recording") { stopRecord(); return; }
  const text = (player.phrases || []).join("") && (player.text || "").replace(/[/|｜／]/g, "").trim();
  if (!text) { alert("先に発音する文を表示してください"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("録音にはHTTPS接続が必要です。\n\n・Mac本体なら http://localhost:8765 で開く\n・スマホからは Tailscale の https URL で開く\n（設定方法はREADME参照）");
    return;
  }
  try {
    // 発音評価用：ノイズ抑制・エコーキャンセルは子音を削ってしまうためオフ。
    // 可能なら最初から16kHzモノラルで取得してリサンプリングを避ける。
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, sampleRate: 16000,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false,
    }});
    recChunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, { type: mediaRec.mimeType || "audio/webm" });
      setRecording(blob, text);   // 再生用は元のまま保持
      // Azureはwebm/opusを正しく解析できないため、16kHz mono WAVに変換して送る
      try {
        const wav = await blobToWav16k(blob);
        sendAssess(wav, text, "audio/wav; codecs=audio/pcm; samplerate=16000");
      } catch(e) {
        sendAssess(blob, text, blob.type || "audio/webm; codecs=opus");
      }
    };
    mediaRec.start();
    recStart = Date.now();
    btn.classList.add("recording");
    document.getElementById("assessBox").style.display = "none";
    clearInterval(recTimer);
    recTimer = setInterval(() => {   // 残り時間を表示しつつ上限で自動停止
      const sec = Math.floor((Date.now() - recStart) / 1000);
      btn.textContent = `⏹ 停止 ${sec}s`;
      if (sec >= REC_LIMIT_SEC) stopRecord();
    }, 250);
    btn.textContent = "⏹ 停止 0s";
  } catch(e) { alert("マイクを使用できません: " + e.message); }
}

function stopRecord() {
  clearInterval(recTimer);
  if (mediaRec && mediaRec.state === "recording") mediaRec.stop();
  const btn = document.getElementById("btnRec");
  btn.textContent = "🎙 録音"; btn.classList.remove("recording");
}

// ---- 録音の保持・再生（聴き比べ用） ----
let recUrl = null, recAudio = null, recText = "";

function setRecording(blob, text) {
  if (recUrl) URL.revokeObjectURL(recUrl);
  recUrl = URL.createObjectURL(blob);
  recText = text;
  recAudio = new Audio(recUrl);
  document.getElementById("btnPlayRec").style.display = "";
  document.getElementById("btnPlayModel").style.display = "";
}

function playMyRec() {
  if (!recAudio) return;
  speechSynthesis.cancel();  // お手本と重ならないように
  playerStop();
  recAudio.currentTime = 0;
  recAudio.play().catch(e => alert("再生できません: " + e.message));
}

function playModel() {   // お手本（音声合成）を同じ文で再生
  if (!recText) return;
  if (recAudio) recAudio.pause();
  speak(recText);
}

// 録音（webm/opus等）を 16kHz mono の WAV に変換する
async function blobToWav16k(blob) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const decoded = await new AC().decodeAudioData(buf);
  const rate = 16000;
  const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
    1, Math.ceil(decoded.duration * rate), rate);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  const pcm = rendered.getChannelData(0);
  // 音量を正規化（小さすぎる録音でも子音が判定されやすくなる。上限は歪み防止に-3dBFS）
  let peak = 0;
  for (let i = 0; i < pcm.length; i++) { const a = Math.abs(pcm[i]); if (a > peak) peak = a; }
  const gain = peak > 0.001 ? Math.min(0.7 / peak, 8) : 1;
  const bytes = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) bytes.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); bytes.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVEfmt ");
  bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, 1, true);
  bytes.setUint32(24, rate, true); bytes.setUint32(28, rate * 2, true);
  bytes.setUint16(32, 2, true); bytes.setUint16(34, 16, true);
  w(36, "data"); bytes.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const v = Math.max(-1, Math.min(1, pcm[i] * gain));
    bytes.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
  }
  return new Blob([bytes.buffer], { type: "audio/wav" });
}

async function sendAssess(blob, text, ctype) {
  const box = document.getElementById("assessBox");
  box.style.display = "";
  box.innerHTML = '<span class="sub">発音を判定中…</span>';
  try {
    const r = await fetch(`/api/assess?lang=${lang}&text=${encodeURIComponent(text)}`, {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream", "X-Audio-Type": ctype || blob.type || "audio/wav" },
      body: blob,
    });
    const j = await r.json();
    if (!j.ok) { box.innerHTML = `<span class="msg ng">${esc(j.error)}</span>`; return; }
    renderAssess(j.data);
  } catch(e) { box.innerHTML = `<span class="msg ng">${esc(e.message)}</span>`; }
}

function scoreColor(s) { return s >= 80 ? "var(--ok)" : s >= 60 ? "#e0a100" : "var(--ng)"; }

function renderAssess(d) {
  const box = document.getElementById("assessBox");
  const sc = d.scores;
  const omitted = d.words.filter(w => w.error === "Omission").length;
  let h = `<div style="font-size:13px;margin-bottom:4px">
    総合 <b style="color:${scoreColor(sc.pron)}">${sc.pron}</b>
    <span class="sub">｜発音 ${sc.accuracy}／なめらかさ ${sc.fluency}／読めた割合 ${sc.completeness}%${sc.prosody ? "／抑揚 " + sc.prosody : ""}</span></div>`;
  // 大半が読まれていない場合のみ短く警告
  if (sc.completeness < 50 || sc.fluency === 0) {
    h += `<div class="msg ng" style="margin:0 0 4px">⚠️ ${omitted}語が聞き取れませんでした</div>`;
  }
  h += `<div style="display:flex;flex-wrap:wrap;gap:4px" id="assessWords">`;
  d.words.forEach((w, i) => {
    const miss = w.error === "Omission";
    const bad = (w.error !== "None" && !miss) || (w.score < 60 && !miss);
    const bg = miss ? "#eef1f8" : (bad ? "#fdecec" : "#eaf7ef");
    const col = miss ? "var(--muted)" : scoreColor(w.score);
    h += `<span class="aw" data-i="${i}" style="padding:3px 7px;border-radius:8px;font-size:16px;cursor:pointer;
      background:${bg};color:${col}">${esc(w.word)}</span>`;
  });
  h += `</div>`;
  const wrong = d.words.filter(w => w.error !== "Omission" && (w.error !== "None" || w.score < 60));
  if (wrong.length) h += `<div class="sub" style="margin-top:4px">直したい: ${wrong.map(w =>
      esc(w.word) + (w.worst ? `（${esc(w.worst.name)}）` : "")).join("、")}</div>`;
  else if (sc.completeness >= 50) h += `<div class="sub" style="margin-top:4px">よくできました！</div>`;
  box.innerHTML = h;
  lastAssess = d;
  // 単語の長押し／右クリックで説明を表示
  box.querySelectorAll(".aw").forEach(el => {
    el.oncontextmenu = ev => { ev.preventDefault(); showWordDetail(+el.dataset.i); return false; };
    let t = null;
    el.addEventListener("touchstart", () => {
      t = setTimeout(() => { t = null; showWordDetail(+el.dataset.i); }, 450);
    }, { passive: true });
    const cancel = () => { if (t) { clearTimeout(t); t = null; } };
    el.addEventListener("touchend", cancel);
    el.addEventListener("touchmove", cancel);
  });
}

let lastAssess = null;

function showWordDetail(i) {
  const w = lastAssess && lastAssess.words[i];
  if (!w) return;
  let msg = `「${w.word}」\n\n`;
  if (w.error === "Omission") {
    msg += "⬜ グレー＝この単語が聞き取れませんでした。\n読み飛ばしたか、声が小さかった可能性があります。";
  } else {
    msg += `発音スコア: ${w.score} 点\n`;
    msg += w.score >= 80 ? "🟩 緑＝よくできています（80点以上）\n"
         : w.score >= 60 ? "🟨 黄＝おしい（60〜79点）。もう少しはっきり発音しましょう\n"
         : "🟥 赤＝お手本と違って聞こえます（60点未満）\n";
    if (w.error === "Mispronunciation") msg += "\n判定: 発音まちがい\n";
    if (w.error === "Insertion") msg += "\n判定: 余分な音が入っています\n";
    if (w.kind_label) {
      msg += `\nミスの種類: ${w.kind}（${w.kind_label}）\n`;
      if (w.kind_char) msg += `間違えた字: ${w.kind_char}\n`;
      if (w.expected_py && w.heard)
        msg += `正しい読み: ${w.expected_py} → 実際: ${w.heard}${w.heard_char ? "（" + w.heard_char + "に聞こえた）" : ""}\n`;
    }
    if (w.phoneme_scores && w.phoneme_scores.length) {
      msg += "\n音ごとの点数（正しい読み）:\n";
      w.phoneme_scores.forEach(p => { msg += `  ${p[0]} … ${p[1]}点\n`; });
      if (w.worst) msg += `\nいちばん弱い音: ${w.worst.name}（${w.worst.score}点）`;
    }
  }
  alert(msg);
}

let breakEditMode = false;
function toggleBreakEdit() {
  breakEditMode = !breakEditMode;
  document.getElementById("btnBreakEdit").classList.toggle("active", breakEditMode);
  document.getElementById("breakEditHint").textContent =
    breakEditMode ? "文字の間（｜）をタップで区切り" : "";
  if (breakEditMode) { playerClose(); }  // 発音より区切り編集を優先
  renderArtSentences();
}

function toggleBreak(idx, pos) {
  const s = curArticle.sentences.find(x => x.idx === idx);
  s.breaks = s.breaks || [];
  const i = s.breaks.indexOf(pos);
  if (i >= 0) s.breaks.splice(i, 1); else s.breaks.push(pos);
  if (isDialog()) {
    renderDlgTurns();
    api("/api/dialogs/breaks", { dialog_id: curArticle.id, idx, breaks: s.breaks }).catch(() => {});
    return;
  }
  renderArtSentences();
  api("/api/articles/breaks", { article_id: curArticle.id, idx, breaks: s.breaks }).catch(() => {});
}

let suppressTap = false;
function showArtHelp() {
  alert("文字をタップ＝発音\n長押し（PCは右クリック）＝ミス記録\n▶＝節ごとに発音\n「日本語」＝訳を表示\n\n区切りを変えるときは「✂️ 区切り編集」を押してから、文字の間（｜）をタップ");
}

function charTap(ch) { if (suppressTap) { suppressTap = false; return; } speak(ch); }  // タップ＝発音

// 長押し（touch）でミス記録メニュー
function attachLongPress(el) {
  let timer = null;
  const start = () => {
    timer = setTimeout(() => { timer = null; suppressTap = true; openFailMenu(el); }, 450);
  };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchmove", cancel);
}

function charMenu(ev) {  // PC: 右クリック
  ev.preventDefault();
  openFailMenu(ev.currentTarget);
  return false;
}

let failLabelsZh = [{ code: "F", name: "Fail" }];

function openFailMenu(el) {
  const scope = el.dataset.scope || "s";
  const idx = +el.dataset.idx, ci = +el.dataset.ci, ch = el.dataset.ch, py = el.dataset.py;
  const pop = document.getElementById("failPop");
  const where = scope === "v" ? "語彙" : `第${idx}句`;
  document.getElementById("failPopChar").textContent = `${ch}  ${py}（${where}）`;
  const already = (curArticle.fails || []).some(
    f => (f.scope || "s") === scope && f.idx === idx && f.ci === ci);
  const args = `'${scope}',${idx},${ci}`;
  let btns = failLabelsZh.map(l =>
    `<button class="fbtn" title="${esc(l.name)}" onclick="setCharFail(${args},'${ch.replace(/'/g,"\\'")}','${py.replace(/'/g,"\\'")}','${l.code}')"><b>${l.code}</b> ${esc(l.name)}</button>`).join("");
  if (already) btns += `<button class="fbtn rm" onclick="removeCharFail(${args})">✕ 取消</button>`;
  document.getElementById("failPopBtns").innerHTML = btns;
  // 会話練習では拼音も直せる（多音字を自動生成が外したとき用）
  const pyBox = document.getElementById("failPopPy");
  if (isDialog() && scope === "s") {
    pyBox.style.display = "";
    pyBox.innerHTML = `<input class="pyin" value="${esc(py)}" spellcheck="false"
        autocapitalize="off" autocorrect="off" inputmode="latin">
      <span class="pyprev"></span>
      <button class="fbtn" onclick="saveCharPinyin(${idx},${ci})">拼音を直す</button>`;
    const inp = pyBox.querySelector(".pyin"), prev = pyBox.querySelector(".pyprev");
    const pv = () => { const v = pyNormalize(inp.value); prev.textContent = (v && v !== inp.value.trim()) ? "→ " + v : ""; };
    inp.oninput = pv; pv();
    inp.onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); saveCharPinyin(idx, ci); } };
  } else { pyBox.style.display = "none"; pyBox.innerHTML = ""; }
  // 位置：文字の近く
  const r = el.getBoundingClientRect();
  pop.style.display = "block";
  const pw = 260, ph = pop.offsetHeight || 120;
  let left = Math.min(r.left, window.innerWidth - pw - 10);
  let top = r.bottom + 6; if (top + ph > window.innerHeight) top = r.top - ph - 6;
  pop.style.left = Math.max(8, left) + "px";
  pop.style.top = Math.max(8, top) + "px";
}

function closeFailMenu() { document.getElementById("failPop").style.display = "none"; }
document.addEventListener("click", (e) => {
  const pop = document.getElementById("failPop");
  if (pop.style.display === "block" && !pop.contains(e.target) && !e.target.classList.contains("cchar") && !e.target.closest(".cchar"))
    closeFailMenu();
});

function dropFail(scope, idx, ci) {
  curArticle.fails = (curArticle.fails || []).filter(
    f => !((f.scope || "s") === scope && f.idx === idx && f.ci === ci));
}

// ============================================================ 会話練習
// 記事と同じ形のデータなので、文字マス・ミス記録・区切り・プレイヤーは
// 記事の仕組みをそのまま使う。違うのは「誰の発言か」と「自分の番を伏せる」ところ。
let dlgHideMe = true;
const dlgOpened = new Set();   // 一度開いたターンは伏せ字に戻さない

// 声調記号（ǎ など）はキーボードから打てないので wei2 → wéi で入力させる
const PY_TONES = { a:"āáǎà", o:"ōóǒò", e:"ēéěè", i:"īíǐì", u:"ūúǔù", "ü":"ǖǘǚǜ" };
function pyNum2Mark(tok) {
  const m = /^([a-zA-ZüÜvV]+)([0-5])$/.exec(tok);
  if (!m) return tok;
  const w = m[1].toLowerCase().replace(/v/g, "ü");
  const t = +m[2];
  if (!t || t === 5) return w;
  let i = w.indexOf("a");
  if (i < 0) i = w.indexOf("o");
  if (i < 0) i = w.indexOf("e");
  if (i < 0) {
    const iu = w.indexOf("iu"), ui = w.indexOf("ui");
    if (iu >= 0) i = iu + 1; else if (ui >= 0) i = ui + 1; else i = w.search(/[iuü]/);
  }
  if (i < 0) return w;
  const set = PY_TONES[w[i]];
  return set ? w.slice(0, i) + set[t - 1] + w.slice(i + 1) : w;
}
const pyNormalize = (v) => String(v == null ? "" : v).trim().split(/\s+/).map(pyNum2Mark).join(" ").trim();

async function loadDialogs() {
  const box = document.getElementById("dialogList");
  box.innerHTML = "読み込み中…";
  try {
    const list = await api("/api/dialogs");
    if (!list.length) { box.textContent = "会話データがありません（data/dialogs_zh.json）"; return; }
    box.innerHTML = list.map(d =>
      `<div class="dlgitem" onclick="openDialog('${esc(d.id)}')">
         <div><b>${esc(d.jp_title || d.title)}</b></div>
         <div class="sub">${esc(d.zh_title)}　${d.turns}往復・${d.total_chars}字・語彙${d.vocab}
           ${d.fails ? `<span class="badge">ミス ${d.fails}</span>` : ""}</div>
       </div>`).join("");
  } catch (e) { box.textContent = e.message; }
}

async function openDialog(id) {
  lang = "zh";                 // 会話は中国語：発音と拼音を中国語モードに
  explicitBreaks = false;      // 自動区切り＋手で足す
  breakEditMode = false;
  document.getElementById("btnDlgBreak").classList.remove("active");
  document.getElementById("dlgBreakHint").textContent = "";
  dlgOpened.clear();
  try {
    const d = await api("/api/dialog?id=" + encodeURIComponent(id));
    curArticle = d;
    document.getElementById("dlgTitle").textContent = d.jp_title || d.title;
    document.getElementById("dialogListCard").style.display = "none";
    document.getElementById("dialogDetail").style.display = "";
    renderDlgTurns();
    renderDlgVocab();
    window.scrollTo(0, 0);
  } catch (e) { msg("msgDlg", e.message, false); }
}

function closeDialog() {
  document.getElementById("dialogDetail").style.display = "none";
  document.getElementById("dialogListCard").style.display = "";
  playerClose();
  curArticle = null;
  loadDialogs();
}

function toggleDlgHide() {
  dlgHideMe = !dlgHideMe;
  document.getElementById("btnDlgHide").classList.toggle("active", dlgHideMe);
  renderDlgTurns();
}

function toggleDlgBreakEdit() {
  breakEditMode = !breakEditMode;
  document.getElementById("btnDlgBreak").classList.toggle("active", breakEditMode);
  document.getElementById("dlgBreakHint").textContent =
    breakEditMode ? "文字の間（｜）をタップで区切り" : "";
  if (breakEditMode) playerClose();
  renderDlgTurns();
}

function revealTurn(idx) { dlgOpened.add(idx); renderDlgTurns(); }

function renderDlgTurns() {
  const box = document.getElementById("dlgTurns");
  box.innerHTML = "";
  const fmap = failMap("s");
  curArticle.sentences.forEach(s => {
    const mine = s.role === "me";
    const hide = mine && dlgHideMe && !dlgOpened.has(s.idx) && !breakEditMode;
    const row = document.createElement("div");
    row.className = "turn " + (mine ? "me" : "other");
    const pairs = s.pairs || (s.zh || "").split("").map(c => [c, ""]);
    const breaks = new Set(s.breaks || []);
    let grid = `<div class="cgrid${breakEditMode ? " editbreaks" : ""}${hide ? " masked" : ""}">`;
    pairs.forEach((p, ci) => {
      const [ch, py] = p;
      const selectable = !!py && !breakEditMode && !hide;
      if (ci > 0) grid += `<span class="cgap${breaks.has(ci - 1) ? " brk" : ""}" ${breakEditMode ? `onclick="toggleBreak(${s.idx},${ci - 1})"` : ""}></span>`;
      grid += charCellHTML("s", s.idx, ci, ch, py, fmap[failKey("s", s.idx, ci)], selectable);
    });
    grid += "</div>";
    row.innerHTML = `<div class="bub">${grid}` +
      (s.ja ? `<div class="sub" style="margin-top:4px">${esc(s.ja)}</div>` : "") +
      `<div class="row" style="margin-top:6px">
         <button class="small ghost" onclick="playArtSentence(${s.idx})" title="節ごとに発音">▶</button>
         <button class="small ghost" onclick="editTurn(${s.idx})" title="中国語を直す">✏️</button>
         ${hide ? `<button class="small ghost" onclick="revealTurn(${s.idx})" title="見る">👁</button>` : ""}
       </div></div>`;
    box.appendChild(row);
    row.querySelectorAll(".cchar").forEach(el => attachLongPress(el));
  });
}

function renderDlgVocab() {
  const box = document.getElementById("dlgVocab");
  const vs = curArticle.vocab || [];
  if (!vs.length) { box.innerHTML = "（なし）"; return; }
  const fmap = failMap("v");
  let hh = `<table class="htable"><tr><th>語</th><th>日本語</th></tr>`;
  vs.forEach((v, vi) => {
    const pairs = v.pairs || (v.zh || "").split("").map(c => [c, ""]);
    let grid = `<div class="cgrid vocabgrid">`;
    pairs.forEach((p, ci) => {
      const [ch, py] = p;
      grid += charCellHTML("v", vi, ci, ch, py, fmap[failKey("v", vi, ci)], !!py);
    });
    grid += "</div>";
    hh += `<tr><td>${grid}</td><td>${esc(v.ja || "")}</td></tr>`;
  });
  box.innerHTML = hh + "</table>";
  box.querySelectorAll(".cchar").forEach(el => attachLongPress(el));
}

async function editTurn(idx) {
  const s = curArticle.sentences.find(x => x.idx === idx);
  if (!s) return;
  const v = prompt("中国語を直す（拼音は自動で振り直します）", s.zh);
  if (v === null) return;
  const zh = v.replace(/\s+/g, "").trim();
  if (!zh || zh === s.zh) return;
  try {
    const d = await api("/api/dialogs/text", { dialog_id: curArticle.id, idx, zh });
    s.zh = d.zh; s.pairs = d.pairs; s.breaks = [];
    curArticle.fails = (curArticle.fails || []).filter(
      f => !((f.scope || "s") === "s" && f.idx === idx));   // 文字位置がずれるので外す
    dlgOpened.add(idx);
    renderDlgTurns();
  } catch (e) { alert(e.message); }
}

async function saveCharPinyin(idx, ci) {
  const inp = document.querySelector("#failPopPy .pyin");
  const v = pyNormalize(inp ? inp.value : "");
  closeFailMenu();
  if (!v) return;
  const s = curArticle.sentences.find(x => x.idx === idx);
  if (s && s.pairs && s.pairs[ci]) s.pairs[ci][1] = v;
  renderDlgTurns();
  try { await api("/api/dialogs/text", { dialog_id: curArticle.id, idx, py: { [ci]: v } }); }
  catch (e) { alert(e.message); }
}

function renderArtScope(scope) {
  if (curArticle && curArticle.kind === "dialog") {
    if (scope === "v") renderDlgVocab(); else renderDlgTurns();
    return;
  }
  if (scope === "v") renderArtVocab(); else renderArtSentences();
}
const isDialog = () => !!(curArticle && curArticle.kind === "dialog");

async function setCharFail(scope, idx, ci, ch, py, label) {
  closeFailMenu();
  try {
    const d = isDialog()
      ? await api("/api/dialogs/fail", { dialog_id: curArticle.id, scope, idx, ci, char: ch, syllable: py, label })
      : await api("/api/articles/fail", { article_id: curArticle.id, scope, idx, ci, char: ch, syllable: py, label });
    dropFail(scope, idx, ci);
    (curArticle.fails = curArticle.fails || []).push({ scope, idx, ci, char: ch, syllable: py, label, pushed: false });
    renderArtScope(scope);
    if (!isDialog()) updatePending(d.pending_fails);
  } catch(e) { alert(e.message); }
}

async function removeCharFail(scope, idx, ci) {
  closeFailMenu();
  try {
    const d = isDialog()
      ? await api("/api/dialogs/unfail", { dialog_id: curArticle.id, scope, idx, ci })
      : await api("/api/articles/unfail", { article_id: curArticle.id, scope, idx, ci });
    dropFail(scope, idx, ci);
    renderArtScope(scope);
    if (!isDialog()) updatePending(d.pending_fails);
  } catch(e) { alert(e.message); }
}

function rubyHTML(pairs, zh) {
  // 文字の上に拼音を載せて1行で表現
  if (!pairs) return esc(zh || "");
  return pairs.map(([ch, py]) =>
    `<ruby>${esc(ch)}<rt>${esc(py)}</rt></ruby>`).join("");
}

function renderArtVocab() {
  const box = document.getElementById("artVocab");
  if (!curArticle.vocab || !curArticle.vocab.length) { box.innerHTML = "（なし）"; return; }
  const fmap = failMap("v");
  let h = `<table class="htable"><tr><th>語</th><th>日本語</th></tr>`;
  curArticle.vocab.forEach((v, vi) => {
    const pairs = v.pairs || (v.zh || "").split("").map(c => [c, ""]);
    let grid = `<div class="cgrid vocabgrid">`;
    pairs.forEach((p, ci) => {
      const [ch, py] = p;
      grid += charCellHTML("v", vi, ci, ch, py, fmap[failKey("v", vi, ci)], !!py);
    });
    grid += "</div>";
    h += `<tr><td>${grid}
      <button class="icon" onclick="speak('${(v.zh||'').replace(/'/g,"\\'")}')">🔊</button></td>
      <td>${esc(v.ja)}</td></tr>`;
  });
  box.innerHTML = h + "</table>";
  // 長押し（モバイル）でミス記録メニュー。本文と同じ操作
  box.querySelectorAll(".cchar").forEach(el => attachLongPress(el));
}

function updatePending(n) {
  if (n === undefined) n = (curArticle.fails || []).filter(f => !f.pushed).length;
  document.getElementById("pendingBadge").textContent = n ? `未反映 ${n}` : "";
}

async function finishStudy() {
  try {
    const d = await api("/api/articles/session", { article_id: curArticle.id });
    alert(`勉強完了！ Nomiss率 ${d.nomiss}%（ミス ${d.misses}/${d.total}字）`);
    closeArticle();
  } catch(e) { alert(e.message); }
}

async function pushFails() {
  const btn = document.getElementById("btnPush");
  btn.disabled = true;
  try {
    const d = await api("/api/articles/push", { article_id: curArticle.id });
    (curArticle.fails || []).forEach(f => f.pushed = true);
    updatePending(0);
    alert(d.pushed ? `Notionの失敗履歴に${d.pushed}件反映しました` : "反映するミスはありませんでした");
  } catch(e) { alert(e.message); }
  btn.disabled = false;
}

async function delWord(id) {
  if (!confirm("この単語を削除しますか？")) return;
  try {
    await api("/api/words/delete", { id });
    loadHistory();
  } catch(e) { alert(e.message); }
}

async function recFail(btn, id, label) {
  btn.disabled = true;
  try {
    const d = await api("/api/fail", { id, label });
    const c = btn.closest("tr").querySelector(".failc");
    if (c) c.textContent = d.fail_count;
  } catch(e) { alert(e.message); }
  btn.disabled = false;
}

speechSynthesis.getVoices();
setLang(lang);  // 言語ボタンの初期状態
showView("main");  // 初期画面＝練習（ナビの選択状態も設定）
health();
</script>
