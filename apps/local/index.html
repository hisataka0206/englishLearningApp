<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>English Learning</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --accent:#3b6ef5; --ok:#1a9c5d; --ng:#d64545; --muted:#8a90a0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:#222; padding-bottom:40px; }
  header { background:var(--accent); color:#fff; padding:14px 16px; font-size:18px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  #status { font-size:11px; font-weight:400; text-align:right; line-height:1.4; }
  main { max-width:640px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
  textarea { width:100%; min-height:84px; font-size:16px; border:1px solid #d8dce6; border-radius:10px; padding:10px; resize:vertical; }
  button { border:0; border-radius:10px; padding:10px 16px; font-size:15px; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:#eef1f8; color:#333; }
  .small { padding:6px 10px; font-size:13px; border-radius:8px; }
  button:disabled { opacity:.45; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  #english { font-size:19px; line-height:1.5; min-height:28px; border:1px dashed transparent; border-radius:8px; padding:4px; }
  #english:focus { outline:none; border-color:var(--accent); background:#f8faff; }
  #pinyin:focus { outline:none; border-color:var(--accent); background:#f8faff; }
  #pinyin.edited { color:var(--accent); font-weight:600; }
  .kw { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid #f0f1f5; font-size:15px; }
  .kw:last-child { border-bottom:0; }
  .kw .m { color:var(--muted); font-size:13px; }
  .tab { background:#eef1f8; }
  .tab.active { background:var(--accent); color:#fff; }
  .htable { width:100%; border-collapse:collapse; margin-top:6px; }
  .htable th { text-align:left; font-size:11px; color:var(--muted); padding:4px; border-bottom:2px solid #e2e5ee; font-weight:600; }
  .htable td { padding:7px 4px; border-bottom:1px solid #f0f1f5; vertical-align:top; font-size:14px; }
  .htable .sub { color:var(--muted); font-size:12px; }
  .dateh { font-size:13px; font-weight:700; color:var(--accent); margin:14px 0 0; border-left:3px solid var(--accent); padding-left:6px; }
  .seclabel { font-size:11px; color:var(--muted); margin:6px 0 0; }
  .icon { padding:4px 8px; font-size:14px; border-radius:8px; background:#eef1f8; border:0; cursor:pointer; }
  .langsel { display:flex; gap:8px; margin-bottom:12px; }
  .langsel button { flex:1; padding:12px; font-size:16px; font-weight:700; border:2px solid #d8dce6; background:#fff; color:#555; border-radius:12px; cursor:pointer; }
  .langsel button.active { border-color:var(--accent); background:var(--accent); color:#fff; }
  .navb { background:rgba(255,255,255,.2); color:#fff; font-size:16px; padding:8px 10px; border-radius:10px; border:0; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .navb.active { background:#fff; color:var(--accent); }
  .reading { background:#fff6cc; border-radius:8px; box-shadow:0 0 0 3px #ffd84d; }
  .gmcard { border:1px solid #e3e6ef; border-radius:14px; padding:12px; margin-bottom:10px; cursor:pointer; background:#fff; }
  .gmcard:active { background:#f4f6ff; }
  .gmcard b { font-size:16px; }
  .gmhead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .gmbar { flex:1; height:8px; background:#eef0f6; border-radius:999px; overflow:hidden; }
  .gmbar > i { display:block; height:100%; background:var(--accent); transition:width .25s; }
  .gmword { font-size:40px; text-align:center; letter-spacing:.08em; margin:14px 0 6px; }
  .gmword span.done { color:#2aa84a; }
  .gmword span.ng { color:#d33; }
  .gmword span.now { text-decoration:underline; text-underline-offset:8px; }
  .gmpy { text-align:center; color:var(--muted); min-height:22px; letter-spacing:.06em; }
  .gmja { text-align:center; font-size:20px; margin:16px 0; }
  .gmsent { font-size:21px; line-height:2; margin:14px 2px; }
  .gmsent u { text-decoration:none; border-bottom:3px solid var(--accent); padding:0 18px; }
  .gmchoices { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .gmchoices button { padding:14px 8px; font-size:16px; border-radius:12px; border:1px solid #dfe3ee; background:#fff; }
  .gmchoices button.ok { background:#e6f8ea; border-color:#2aa84a; }
  .gmchoices button.ng { background:#fdeaea; border-color:#d33; }
  .gmtones { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .gmtones button { padding:16px 0; font-size:26px; border-radius:12px; border:1px solid #dfe3ee; background:#fff; }
  .gmtiles { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; }
  .gmtiles button { width:58px; height:58px; font-size:28px; border-radius:12px; border:1px solid #dfe3ee; background:#fff; }
  .gmtiles button:disabled { opacity:.25; }
  .gmslot { text-align:center; font-size:34px; min-height:46px; letter-spacing:.1em; }
  .gmfb { text-align:center; font-size:15px; min-height:24px; margin-top:8px; }
  .gmfb.ok { color:#2aa84a; } .gmfb.ng { color:#d33; }
  .gmcombo { font-weight:700; color:#f08c00; }
  #readBar { position:fixed; left:50%; transform:translateX(-50%); bottom:70px; z-index:40;
    background:#fff; border:1px solid var(--accent); border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.18); padding:6px 8px; gap:6px; align-items:center; }
  #readBar select { font-size:13px; padding:4px 6px; border-radius:8px; border:1px solid #ddd; background:#fff; }
  #readBar button { white-space:nowrap; flex:0 0 auto; }
  #readBar .sub { white-space:nowrap; }
  .artrow { padding:10px 4px; border-bottom:1px solid #f0f1f5; cursor:pointer; }
  .artrow:hover { background:#f8faff; }
  .artrow.studied { background:#eceef3; color:#666; }
  .artrow .t { font-size:14px; }
  .asent { padding:10px 4px; border-bottom:1px solid #f0f1f5; }
  .cgrid { display:flex; flex-wrap:wrap; align-items:flex-end; margin:4px 0 6px; }
  .cchar { display:inline-flex; flex-direction:column; align-items:center; cursor:pointer;
    padding:1px 2px; border-radius:6px; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .cchar:active { background:#e8eeff; }
  .cchar .py { font-size:11px; color:var(--accent); line-height:1.2; min-height:13px; }
  .cchar .hz { font-size:22px; line-height:1.25; }
  .cchar.failed .hz { color:var(--ng); }
  .cchar.failed .lb { font-size:9px; color:var(--ng); line-height:1; }
  /* 重要語彙：本文より少し小さいマス目で1文字ずつミス登録できる */
  .cgrid.vocabgrid { display:inline-flex; flex-wrap:nowrap; margin:0; vertical-align:middle; }
  .cgrid.vocabgrid .cchar .hz { font-size:19px; }
  .cgap { width:3px; align-self:stretch; border-radius:3px; margin:0 1px; }
  .cgap.brk { width:3px; background:var(--accent); }
  /* 区切り編集モード：文字間のタップ領域を大きくして押しやすく */
  .cgrid.editbreaks .cgap { width:22px; cursor:pointer; background:#eef1f8; position:relative; }
  .cgrid.editbreaks .cgap::after { content:"｜"; color:#b8c0d8; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .cgrid.editbreaks .cgap.brk { background:var(--accent); }
  .cgrid.editbreaks .cgap.brk::after { content:"✂"; color:#fff; font-size:11px; }
  .cgrid.editbreaks .cchar { opacity:.75; }
  .dlgitem { padding:11px 4px; border-bottom:1px solid #f0f1f5; cursor:pointer; }
  .dlgitem:last-child { border-bottom:0; }
  .turn { display:flex; margin:8px 0; }
  .turn.me { justify-content:flex-end; }
  .turn .bub { max-width:92%; background:#fff; border-radius:14px; padding:9px 12px;
    box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .turn.me .bub { background:#e8edff; }
  .turn .cgrid.masked { filter:blur(6px); }
  #failPopPy { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    margin-top:8px; padding-top:8px; border-top:1px solid #eef1f8; }
  #failPopPy .pyin { flex:1; min-width:96px; font-size:14px; padding:6px 8px;
    border:1px solid #d8dce6; border-radius:8px; }
  #failPopPy .pyprev { font-size:14px; color:var(--ok); font-weight:700; }
  .fbtn { display:inline-block; margin:2px; padding:8px 10px; border:0; border-radius:8px; background:#eef1f8; font-size:14px; cursor:pointer; }
  .fbtn.rm { background:#fdecec; color:var(--ng); }
  #btnRec.recording { background:var(--ng); color:#fff; }
  ruby rt { font-size:.55em; color:var(--accent); }
  .wword { font-size:20px; line-height:1.6; }
  .wtbl td { vertical-align:middle; }
  .jatoggle { margin-top:6px; }
  .jatoggle summary { font-size:13px; color:var(--accent); cursor:pointer; list-style:none; display:inline-block; padding:2px 8px; background:#eef1f8; border-radius:8px; }
  .jatoggle summary::-webkit-details-marker { display:none; }
  .jatoggle[open] summary { color:var(--muted); background:transparent; padding-left:0; }
  .badge { background:#fdecec; color:var(--ng); border-radius:8px; font-size:12px; padding:2px 8px; }
  .msg { font-size:13px; margin-top:8px; min-height:16px; }
  .msg.ok { color:var(--ok); } .msg.ng { color:var(--ng); }
  h2 { font-size:14px; color:var(--muted); margin:0 0 8px; font-weight:600; }
  select { font-size:13px; padding:6px; border-radius:8px; border:1px solid #d8dce6; }
  label.rate { font-size:13px; color:var(--muted); }
  #player { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--accent);
    box-shadow:0 -2px 10px rgba(0,0,0,.12); padding:10px 12px 14px; display:none; z-index:10; }
  #player .inner { max-width:640px; margin:0 auto; }
  #phrases { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;
    max-height:24vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .chip { background:#eef1f8; border-radius:16px; padding:6px 12px; font-size:14px; cursor:pointer; text-align:center; }
  .chip.active { background:var(--accent); color:#fff; }
  .chip.done { background:#d7e3ff; }
  .chip .cpy { font-size:10px; opacity:.7; }
</style>
</head>
<body>
<header>English Learning <span id="ver" style="font-size:11px;font-weight:400;opacity:.8"></span>
  <div style="display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%">
    <div id="status">…</div>
    <button class="navb" id="nav_main" onclick="showView('main')">✍️ 自分の文</button>
    <button class="navb" id="nav_articles" onclick="showView('articles')">📰 記事</button>
    <button class="navb" id="nav_dialog" onclick="showView('dialog')">💬 会話</button>
    <button class="navb" id="nav_gloss" onclick="showView('gloss')">📚 用語</button>
    <button class="navb" id="nav_game" onclick="showView('game')">🎮 ゲーム</button>
    <button class="navb" id="nav_record" onclick="showView('record')">📊 記録</button>
    <button class="navb" onclick="location.reload()">⟳</button>
  </div>
</header>
<main>
<div id="viewMain">
  <div class="langsel">
    <button id="lang_en" onclick="setLang('en')">🇺🇸 日⇨英</button>
    <button id="lang_zh" onclick="setLang('zh')">🇨🇳 日⇨中</button>
    <button id="lang_ja" onclick="setLang('ja')">🇯🇵 中⇨日</button>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="tab small active" id="sub_compose" onclick="setSub('compose')">作成</button>
    <button class="tab small" id="sub_history" onclick="setSub('history')">履歴</button>
  </div>
  <div id="subCompose">
  <div class="card">
    <textarea id="ja" placeholder="言いたいことを日本語で入力"></textarea>
    <div class="row">
      <button class="primary" id="btnTr" onclick="doTranslate()">英語にする</button>
      <button class="ghost" id="btnNew" onclick="clearCompose()" title="入力をクリアして新しい文を書く">🔄 新規</button>
      <select id="model" title="翻訳モデル"></select>
    </div>
    <div class="msg" id="msgTr"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2 id="transHead">英訳（タップで編集可。「/」を入れるとその位置で発音を区切ります）</h2>
    <div id="english" contenteditable="true" oninput="englishEdited(this)"></div>
    <div id="pinyinRow" style="display:none;align-items:center;gap:6px;margin-top:2px">
      <div id="pinyin" contenteditable="true" oninput="pinyinEdited(this)"
           title="拼音が違っていればタップして直せます"
           style="color:var(--muted);font-size:13px;flex:1;
                  border:1px dashed transparent;border-radius:6px;padding:2px 4px"></div>
      <button class="small ghost" id="btnPyReset" onclick="resetPinyin()"
              title="自動生成の拼音に戻す">↺</button>
    </div>
    <div id="breakGrid" style="display:none"></div>
    <div class="row">
      <button class="ghost" id="btnSpeak" onclick="playerLoad(current.marked || current.english)" title="発音">🔊</button>
      <button class="small tab" id="btnMainBreak" onclick="toggleMainBreakEdit()">✂️ 区切り編集</button>
      <button class="primary" id="btnSave" onclick="saveSentence()" title="保存">💾</button>
    </div>
    <div id="kwBox" style="margin-top:10px"></div>
    <div class="row" id="kwActions" style="display:none">
      <button class="ghost" id="btnWords" onclick="saveWords()">＋ 単語登録</button>
    </div>
    <div class="msg" id="msgSave"></div>
  </div>
  </div>

  <div id="subHistory" style="display:none">
  <div class="card">
    <h2>履歴 <button class="small ghost" onclick="loadHistory()">更新</button></h2>
    <div class="row" style="margin-top:4px;align-items:center">
      <button class="small tab active" id="tab_date" onclick="setTab('date')">日付別</button>
      <button class="small tab" id="tab_sent" onclick="setTab('sent')">文のみ</button>
      <button class="small tab" id="tab_word" onclick="setTab('word')">単語のみ</button>
      <input id="hFilter" placeholder="検索" oninput="renderHistory()"
        style="flex:1;min-width:80px;font-size:13px;padding:6px;border:1px solid #d8dce6;border-radius:8px">
    </div>
    <div id="history">読み込み中…</div>
  </div>
  </div>
</div>

<div id="viewArticles" style="display:none">
  <div class="card" id="articleListCard">
    <h2>記事
      <button class="small ghost" id="btnRefresh" onclick="refreshArticles()" title="Notionから新着記事を取り込み">🔄</button>
    </h2>
    <div class="msg" id="msgArt"></div>
    <div id="articleList">読み込み中…</div>
  </div>
  <div class="card" id="articleDetail" style="display:none">
    <h2><button class="small ghost" onclick="closeArticle()">← 記事一覧</button>
      <span id="artTitle"></span>
      <button class="small ghost" onclick="showArtHelp()" title="使い方" style="float:right">❓</button></h2>
    <div id="artMeta" style="margin:-4px 0 10px;color:var(--muted)"></div>
    <div id="artSentences"></div>
    <h2 style="margin-top:14px">重要語彙</h2>
    <div id="artVocab"></div>
    <div style="position:sticky;bottom:0;background:var(--card);padding:8px 0;border-top:1px solid #eee">
      <div class="row" style="margin:0 0 6px">
        <button class="small tab" id="btnBreakEdit" onclick="toggleBreakEdit()">✂️ 区切り編集</button>
        <span class="sub" id="breakEditHint"></span>
      </div>
      <div class="row" style="margin:0">
        <button class="primary" onclick="finishStudy()">✅ 勉強完了</button>
        <button class="ghost" id="btnPush" onclick="pushFails()" title="ミスをNotionへ反映">⬆️ Notion</button>
        <span class="badge" id="pendingBadge"></span>
      </div>
    </div>
  </div>
</div>

<div id="viewDialog" style="display:none">
  <div class="card" id="dialogListCard">
    <h2>会話練習</h2>
    <div class="msg" id="msgDlg"></div>
    <div id="dialogList">読み込み中…</div>
  </div>
  <div class="card" id="dialogDetail" style="display:none">
    <h2><button class="small ghost" onclick="closeDialog()">← 一覧</button>
      <span id="dlgTitle"></span></h2>
    <div class="row" style="margin:-2px 0 8px">
      <button class="small tab active" id="btnDlgHide" onclick="toggleDlgHide()">🙈 自分</button>
      <button class="small tab" id="btnDlgBreak" onclick="toggleDlgBreakEdit()">✂️ 区切り編集</button>
      <span class="sub" id="dlgBreakHint"></span>
    </div>
    <div id="dlgTurns"></div>
    <h2 style="margin-top:14px">語彙</h2>
    <div id="dlgVocab"></div>
  </div>
</div>

<div id="viewGloss" style="display:none">
  <div class="card">
    <h2>専門用語集
      <span class="sub" id="glCount" style="font-weight:400"></span>
      <span style="float:right">
        <button class="small ghost" onclick="glPull()" title="Notionから取り込む">⬇️</button>
        <button class="small ghost" onclick="glPush()" title="Notionへ分類を書き戻す">⬆️</button>
      </span>
    </h2>
    <div class="msg" id="msgGloss"></div>
    <div class="row" style="margin:0 0 8px">
      <input id="glQ" placeholder="中文・拼音・日本語で検索" oninput="glSearch(this.value)"
             style="flex:1;min-width:140px">
      <label class="sub" style="display:flex;align-items:center;gap:4px;white-space:nowrap">
        <input type="checkbox" id="glGen" onchange="glToggleGeneral(this.checked)"> 一般
      </label>
    </div>
    <div id="glCats" class="row" style="margin:0 0 10px;gap:6px"></div>
    <div id="glList">読み込み中…</div>
  </div>
</div>

<div id="viewGame" style="display:none">
  <div class="card" id="gmMenu">
    <h2>単語ゲーム <span class="sub" id="gmDeckInfo"></span></h2>
    <div class="gmcard" onclick="gameStart('tone')">
      <b>🎯 声調アタック</b>
      <div class="sub">漢字を見て、1音節ずつ声調を当てる</div>
    </div>
    <div class="gmcard" onclick="gameStart('ear')">
      <b>👂 耳から意味当て</b>
      <div class="sub">音だけ聞いて意味を選ぶ。漢字は答えた後に出る</div>
    </div>
    <div class="gmcard" onclick="gameStart('build')">
      <b>🧩 合体パズル</b>
      <div class="sub">意味を見て、散らばった漢字から語を組み立てる</div>
    </div>
    <div class="gmcard" onclick="gameStart('cloze')">
      <b>📰 記事で穴埋め</b>
      <div class="sub">実際の記事の文の空欄に入る語を選ぶ</div>
    </div>
    <div class="sub" id="gmWeak" style="margin-top:6px"></div>
  </div>

  <div class="card" id="gmPlay" style="display:none">
    <div class="gmhead">
      <button class="small ghost" onclick="gameQuit()">✕</button>
      <div class="gmbar"><i id="gmProg" style="width:0%"></i></div>
      <span class="sub" id="gmCount">0/10</span>
      <span class="sub" id="gmScore">0</span>
    </div>
    <div id="gmBody"></div>
    <div class="gmfb" id="gmFb"></div>
  </div>

  <div class="card" id="gmResult" style="display:none">
    <h2 id="gmResTitle">結果</h2>
    <div id="gmResBody"></div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="gameStart(gm.mode)">もう一度</button>
      <button class="ghost" onclick="gameMenu()">他のゲーム</button>
    </div>
  </div>
</div>

<div id="viewRecord" style="display:none">
  <div class="langsel">
    <button id="rlang_en" onclick="setRecLang('en')">🇺🇸 英語</button>
    <button id="rlang_zh" onclick="setRecLang('zh')">🇨🇳 中国語</button>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="tab small active" id="rtab_weak" onclick="setRecTab('weak')">苦手</button>
    <button class="tab small" id="rtab_hist" onclick="setRecTab('hist')">履歴</button>
    <button class="small ghost" style="margin-left:auto" onclick="clearRecords()" title="この言語の記録を全部消す">🗑</button>
  </div>
  <div class="card"><div id="recordBody">読み込み中…</div></div>
</div>
<!-- 通し読みバー（記事・会話・用語で共用） -->
<div id="readBar" style="display:none">
  <button class="small primary" id="btnReadAll" onclick="readToggle()">▶ 通し読み</button>
  <button class="small ghost" id="btnReadStop" onclick="readStop()" title="最初から">⏹</button>

<script>
let current = { japanese:"", english:"", marked:"", keywords:[], pageId:null };
let failLabels = ["Fail"];
let sentCache = {};
let lang = localStorage.getItem("targetLang") || "en";

// ===== 言語ごとのUIラベルを一元管理（新言語追加時はここに1ブロック足すだけ） =====
const LABELS = {
  en: {
    name: "英語", toBtn: "英語にする",
    transHead: "英訳 ✏️",
    sentTab: "英文のみ", sentCol: "英文 / 日本語", unit: "英文",
    inputPlaceholder: "言いたいことを日本語で入力",
    delConfirm: "この英文を削除しますか？",
    restudy: "保存済みの英文を再学習中（区切りを編集して保存すると上書きされます）",
    slashHint: "区切りたい位置を英文内でタップしてから押してください",
    sample: "This is the speaking speed.",
    ttsLang: "en-US", voicePref: "en", voiceRe: /Samantha/,
  },
  zh: {
    name: "中国語", toBtn: "中国語にする",
    transHead: "中国語訳 ✏️",
    sentTab: "中国語のみ", sentCol: "中国語 / 日本語", unit: "文",
    inputPlaceholder: "言いたいことを日本語で入力",
    delConfirm: "この文を削除しますか？",
    restudy: "保存済みの文を再学習中（区切りを編集して保存すると上書きされます）",
    slashHint: "区切りたい位置を文中でタップしてから押してください",
    sample: "这是朗读的速度。",
    ttsLang: "zh-CN", voicePref: "zh", voiceRe: /Ting|Tingting|Meijia|Sinji/,
  },
  ja: {
    name: "日本語", toBtn: "日本語に翻訳",
    transHead: "日本語訳",
    sentTab: "翻訳のみ", sentCol: "日本語訳 / 中国語", unit: "文",
    inputPlaceholder: "中国語テキストを入力",
    delConfirm: "この翻訳を削除しますか？",
    restudy: "保存済みの翻訳を表示中",
    slashHint: "",
    sample: "",
    ttsLang: "ja-JP", voicePref: "ja", voiceRe: /Kyoko|Otoya/,
  },
};

function L() { return LABELS[lang] || LABELS.en; }

function setLang(l) {
  lang = LABELS[l] ? l : "en";
  localStorage.setItem("targetLang", lang);
  document.getElementById("lang_en").classList.toggle("active", lang === "en");
  document.getElementById("lang_zh").classList.toggle("active", lang === "zh");
  document.getElementById("lang_ja").classList.toggle("active", lang === "ja");
  // 静的なUI文言を一括で切替
  document.getElementById("btnTr").textContent = L().toBtn;
  document.getElementById("transHead").textContent = L().transHead;
  document.getElementById("tab_sent").textContent = L().sentTab;
  document.getElementById("ja").placeholder = L().inputPlaceholder;
  // ja モードは発声・区切り不要 → ボタンを隠す
  const jaMode = lang === "ja";
  document.getElementById("btnSpeak").style.display = jaMode ? "none" : "";
  document.getElementById("btnMainBreak").style.display = jaMode ? "none" : "";
  // 前の言語の結果をクリア（保留中の自動保存が新しい lang で走らないよう止める）
  clearTimeout(autoSaveTimer);
  current = { japanese:"", english:"", marked:"", keywords:[], pageId:null,
              pinyin:"", pinyinManual:false };
  document.getElementById("ja").value = "";
  document.getElementById("pinyin").textContent = "";
  document.getElementById("pinyin").classList.remove("edited");
  document.getElementById("pinyinRow").style.display = "none";
  document.getElementById("resultCard").style.display = "none";
  resetMainBreak();
  playerClose();
  loadHistory();  // 履歴もその言語のものに切替
}

async function api(path, opts) {
  const r = await fetch(path, opts ? { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(opts) } : undefined);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "error");
  return j.data;
}

function rateChanged(v) {
  document.getElementById("rateVal").textContent = parseFloat(v).toFixed(2).replace(/0$/, "");
  localStorage.setItem("speechRate", v);  // 次回起動時も同じ速度
}

function setRate(v) {
  document.getElementById("rate").value = v;
  rateChanged(v);
  speak(L().sample);  // その場で試聴
}

(function initRate() {
  const saved = localStorage.getItem("speechRate");
  if (saved) { document.getElementById("rate").value = saved; }
  rateChanged(document.getElementById("rate").value);
})();

function makeUtter(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = L().ttsLang;
  u.rate = parseFloat(document.getElementById("rate").value);
  const v = speechSynthesis.getVoices().filter(v => v.lang.startsWith(L().voicePref));
  if (v.length) u.voice = v.find(x => L().voiceRe.test(x.name)) || v[0];
  return u;
}

function speak(text) {  // 短い単語・サンプル用（プレイヤーを使わない）
  playerStop();
  speechSynthesis.cancel();
  speechSynthesis.speak(makeUtter(text));
}

// ---- フレーズプレイヤー：節（センスグループ）ごとに分解 ----
// 英語のセンスグループ境界：接続詞・関係詞・前置詞・不定詞to の前で区切る
const ENG_BREAK = /\s+(?=(?:and|but|or|nor|so|yet|because|although|though|while|when|whenever|whereas|if|unless|until|since|that|which|who|whose|whom|where|after|before|to|in|on|at|with|for|from|of|about|into|onto|over|under|through|during|between|among|against|without|within)\b)/i;

function autoSplit(text, mode) {
  if (mode === "sentence") {
    return (text.match(/[^.!?]+[.!?]*/g) || [text]).map(s => s.trim()).filter(Boolean);
  }
  // まず句読点で節に分ける
  const clauses = text.match(/[^,;:.!?]+[,;:.!?]*/g) || [text];
  const out = [];
  clauses.forEach(c => {
    c = c.trim();
    if (!c) return;
    if (mode !== "fine") { out.push(c); return; }  // ふつう＝句読点のみ
    // 細かめ＝センスグループへ自動分割
    const parts = c.split(ENG_BREAK).map(s => s.trim()).filter(Boolean);
    const merged = [];
    parts.forEach(p => {
      // 1語だけの断片は前のグループに結合（"I / love" のような分断を防ぐ）
      if (merged.length && p.split(/\s+/).length <= 1) merged[merged.length - 1] += " " + p;
      else merged.push(p);
    });
    // 先頭が1語だけの孤立なら次に結合
    if (merged.length > 1 && merged[0].split(/\s+/).length <= 1)
      merged.splice(0, 2, merged[0] + " " + merged[1]);
    (merged.length ? merged : [c]).forEach(m => out.push(m));
  });
  return out.length ? out : [text];
}

let zhWordsMap = {};  // clean中文 → jieba単語配列（自動の単語区切り用）

function zhPunct(text, mode) {
  // 句読点区切り（フォールバック）。文単位は 。！？ のみ
  const re = mode === "sentence" ? /[^。！？]+[。！？]*/g : /[^，。！？、；：]+[，。！？、；：]*/g;
  return (text.match(re) || [text]).map(s => s.trim()).filter(Boolean);
}

function zhSplit(text, mode) {
  const clean = text.replace(/[/|｜／\s]/g, "");
  if (mode === "sentence") return zhPunct(clean, "sentence");
  const words = zhWordsMap[clean];
  if (!words || !words.length) return zhPunct(text, mode);  // jieba未取得→句読点
  if (mode === "fine") {
    // 単語（词）レベル：句読点は前の語に結合
    const out = [];
    words.forEach(w => {
      if (/^[，。！？、；：,.!?%（）()]+$/.test(w) && out.length) out[out.length - 1] += w;
      else out.push(w);
    });
    return out.length ? out : [text];
  }
  // ふつう：節（句読点）レベル
  return zhPunct(clean, mode);
}

let explicitBreaks = false;  // trueなら「/」だけで区切る（区切り編集の確定後・自動分割しない）

function splitPhrases(text, mode) {
  mode = mode || document.getElementById("splitMode").value;
  if (explicitBreaks) {  // 編集で確定した区切りのみを使う（自動は足さない）
    return text.split(/[/|｜／]+/).map(s => s.trim()).filter(Boolean);
  }
  // 「/」の手動区切りは自動区切りへの追加
  const segments = text.split(/[/|｜／]+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  const auto = lang === "zh" ? zhSplit : autoSplit;
  (segments.length ? segments : [text]).forEach(seg => out.push(...auto(seg, mode)));
  return out.length ? out : [text];
}

// ---- カーソル位置に「/」を挿入（英訳編集エリア用） ----
let savedRange = null;
document.addEventListener("selectionchange", () => {
  const sel = document.getSelection();
  const en = document.getElementById("english");
  if (sel.rangeCount && en.contains(sel.anchorNode)) {
    savedRange = sel.getRangeAt(0).cloneRange();
  }
});

function insertSlash() {
  const en = document.getElementById("english");
  if (!savedRange || !en.contains(savedRange.startContainer)) {
    msg("msgSave", L().slashHint, false);
    return;
  }
  savedRange.deleteContents();
  const node = document.createTextNode(" / ");
  savedRange.insertNode(node);
  savedRange.setStartAfter(node);  // カーソルを挿入後ろへ
  savedRange.collapse(true);
  const sel = document.getSelection();
  sel.removeAllRanges(); sel.addRange(savedRange);
  englishEdited(en);
  msg("msgSave", "", true);
}

const player = { text: "", phrases: [], idx: 0, playing: false, gen: 0 };

function clearRecording() {   // 別の文に切り替えたら前の録音は消す
  if (recUrl) { URL.revokeObjectURL(recUrl); recUrl = null; }
  recAudio = null; recText = "";
  const a = document.getElementById("btnPlayRec"), b = document.getElementById("btnPlayModel");
  if (a) a.style.display = "none";
  if (b) b.style.display = "none";
  const box = document.getElementById("assessBox");
  if (box) { box.style.display = "none"; box.innerHTML = ""; }
}

function playerSetText(text) {
  if (player.text && player.text !== text) clearRecording();
  player.text = text;
  player.phrases = splitPhrases(text);
  player.idx = 0;
  const box = document.getElementById("phrases");
  box.innerHTML = "";
  player.phrases.forEach((p, i) => {
    const c = document.createElement("span");
    c.className = "chip"; c.textContent = p;
    c.onclick = () => playerPlayOne(i);  // タップした節だけを発音
    box.appendChild(c);
  });
  if (lang === "zh") {  // 各節に拼音を付記
    api("/api/pinyin", { texts: player.phrases }).then(d => {
      if (player.text !== text) return;
      box.querySelectorAll(".chip").forEach((c, i) => {
        if (d.pinyins[i]) c.innerHTML = `${esc(player.phrases[i])}<div class="cpy">${d.pinyins[i]}</div>`;
      });
      playerUpdatePad();
    }).catch(() => {});
  }
  document.getElementById("player").style.display = "block";
  playerUpdatePad();
}

function playerUpdatePad() {
  // プレイヤーの実際の高さぶんだけ本文下部に余白を確保
  const p = document.getElementById("player");
  document.body.style.paddingBottom = (p.offsetHeight + 20) + "px";
}

function playerLoad(text) {
  speechSynthesis.cancel();
  const clean = (text || "").replace(/[/|｜／\s]/g, "");
  if (lang === "zh" && !zhWordsMap[clean]) {
    // 先に単語分割を取得してから節を作る（自動の単語区切り）
    api("/api/pinyin", { texts: [text] }).then(d => {
      if (d.words && d.words[0]) zhWordsMap[clean] = d.words[0];
      playerSetText(text); playerPlay();
    }).catch(() => { playerSetText(text); playerPlay(); });
  } else {
    playerSetText(text); playerPlay();
  }
}

function splitModeChanged() {
  localStorage.setItem("splitMode", document.getElementById("splitMode").value);
  if (player.text) {  // 表示中の文を新しい区切りで再分解（停止状態で待機）
    playerPause();
    playerSetText(player.text);
    playerRender();
  }
}

function englishEdited(el) {
  // 英訳の手編集を反映：以後の発音・保存・単語登録はこの内容を使う
  current.marked = el.textContent.replace(/\s+/g, " ").trim();  // 区切り「/」込み
  current.english = current.marked.replace(/\s*[/|｜／]+\s*/g, " ").replace(/\s+/g, " ").trim();
  current._breaks = null;  // テキストが変わったので区切りは再導出
  explicitBreaks = /[/|｜／]/.test(current.marked);  // 手打ち「/」があれば確定区切り
  document.getElementById("btnSave").disabled = false;  // 編集したら保存可能に（呼び出し中は上書き）
  playerSync();  // 区切りの変更を練習ウィンドウに即反映
  refreshPinyin();
  scheduleAutoSave();  // 同じIDに上書き保存
}

// ---- 区切り編集モード（自分の文側。記事と同じすき間タップ方式） ----
let mainBreakMode = false;

function resetMainBreak() {
  mainBreakMode = false; current._breaks = null;
  explicitBreaks = /[/|｜／]/.test(current.marked || "");  // 「/」があれば確定区切り扱い
  const b = document.getElementById("btnMainBreak");
  if (b) b.classList.remove("active");
  document.getElementById("english").style.display = "";
  document.getElementById("pinyinRow").style.display = lang === "zh" ? "flex" : "none";
  document.getElementById("breakGrid").style.display = "none";
}

async function toggleMainBreakEdit() {
  mainBreakMode = !mainBreakMode;
  document.getElementById("btnMainBreak").classList.toggle("active", mainBreakMode);
  document.getElementById("english").style.display = mainBreakMode ? "none" : "";
  document.getElementById("pinyinRow").style.display =
    (mainBreakMode || lang !== "zh") ? "none" : "flex";
  document.getElementById("breakGrid").style.display = mainBreakMode ? "" : "none";
  if (mainBreakMode) {
    if (lang === "zh") {  // 単語分割を先に取得（自動の単語区切りを初期表示するため）
      const clean = (current.english || "").replace(/[/|｜／\s]/g, "");
      if (!zhWordsMap[clean]) {
        try { const d = await api("/api/pinyin", { texts: [current.english] }); if (d.words && d.words[0]) zhWordsMap[clean] = d.words[0]; } catch(e) {}
      }
    }
    if (!current._breaks) current._breaks = deriveMainBreaks();  // 自動区切りを初期表示
    explicitBreaks = true;               // 以後はこの区切りが正（自動は足さない）
    current.marked = buildMainMarked();
    renderMainBreakGrid();
    playerClose();  // 区切り編集に集中
  } else {
    current.marked = buildMainMarked();
    playerSync();
  }
}

function mainTokens() {
  const t = current.english || "";
  return lang === "zh" ? Array.from(t) : t.split(/\s+/).filter(Boolean);
}

function deriveMainBreaks() {
  // 現在の実際の区切り（自動＋手動）をトークンindexの集合に変換して初期値にする
  const phrases = splitPhrases(current.marked || current.english);
  const br = new Set(); let idx = 0;
  for (let s = 0; s < phrases.length - 1; s++) {
    const toks = lang === "zh"
      ? Array.from(phrases[s].replace(/[/|｜／\s]/g, "")) : phrases[s].split(/\s+/).filter(Boolean);
    idx += toks.length; br.add(idx - 1);
  }
  return br;
}

function buildMainMarked() {
  const toks = mainTokens(); let out = "";
  toks.forEach((tk, i) => {
    out += tk + (lang === "zh" ? "" : " ");
    if (current._breaks && current._breaks.has(i)) out += "/ ";
  });
  return out.replace(/\s+/g, " ").trim();
}

async function renderMainBreakGrid() {
  const box = document.getElementById("breakGrid");
  const toks = mainTokens();
  let pairs = null;
  if (lang === "zh") {
    try { const d = await api("/api/pinyin", { texts: [current.english] }); pairs = d.pairs[0]; } catch(e) {}
  }
  let h = '<div class="cgrid editbreaks">';
  toks.forEach((tk, i) => {
    if (i > 0) h += `<span class="cgap${current._breaks.has(i - 1) ? " brk" : ""}" onclick="toggleMainBreak(${i - 1})"></span>`;
    const py = (pairs && pairs[i]) ? pairs[i][1] : "";
    const sz = lang === "zh" ? "" : ' style="font-size:16px;padding:0 3px"';
    h += `<span class="cchar"><span class="py">${esc(py)}</span><span class="hz"${sz}>${esc(tk)}</span></span>`;
  });
  box.innerHTML = h + "</div>";
}

function toggleMainBreak(pos) {
  if (current._breaks.has(pos)) current._breaks.delete(pos); else current._breaks.add(pos);
  current.marked = buildMainMarked();
  renderMainBreakGrid();
  playerSync();
  scheduleAutoSave();  // 区切りの変更も同じIDに上書き保存
}

// ---- 拼音（自動生成 ＋ 手修正） ----
// 多音字は自動生成が外すことがあるので、手で直したらそれを正として保存し、
// 以後の自動生成では上書きしない（↺ で自動に戻せる）。
function setPinyin(text, manual) {
  current.pinyin = text || "";
  current.pinyinManual = !!manual;
  const el = document.getElementById("pinyin");
  if (el.textContent !== current.pinyin) el.textContent = current.pinyin;
  el.classList.toggle("edited", current.pinyinManual);
  document.getElementById("pinyinRow").style.display = lang === "zh" ? "flex" : "none";
}

function pinyinEdited(el) {
  current.pinyin = el.textContent.replace(/\s+/g, " ").trim();
  current.pinyinManual = true;
  el.classList.add("edited");
  scheduleAutoSave();  // 手修正も同じIDに上書き保存
}

function resetPinyin() {
  current.pinyinManual = false;
  document.getElementById("pinyin").classList.remove("edited");
  refreshPinyin(true);
}

let pinyinTimer = null;
function refreshPinyin(force) {
  if (lang !== "zh") { document.getElementById("pinyinRow").style.display = "none"; return; }
  document.getElementById("pinyinRow").style.display = "flex";
  if (current.pinyinManual && !force) return;  // 手修正を自動生成で踏み潰さない
  clearTimeout(pinyinTimer);
  pinyinTimer = setTimeout(() => {
    const text = current.english;
    api("/api/pinyin", { texts: [text] }).then(d => {
      if (current.english !== text) return;
      if (current.pinyinManual && !force) return;
      setPinyin(d.pinyins[0] || "", false);
      if (force) scheduleAutoSave();  // 自動に戻したことを保存に反映
    }).catch(() => {});
  }, 400);
}

function playerSync() {
  // 編集中の英文（区切り込み）をプレイヤーの節チップに反映（再生はしない）
  if (!current.marked) return;
  player.playing = false;
  player.gen++;
  speechSynthesis.cancel();
  playerSetText(current.marked);
  playerRender();
}

(function initSplitMode() {
  const saved = localStorage.getItem("splitMode");
  document.getElementById("splitMode").value = saved || "fine";  // デフォルトは細かめ
})();

function playerRender() {
  document.querySelectorAll("#phrases .chip").forEach((c, i) => {
    c.className = "chip" + (i < player.idx ? " done" : i === player.idx ? " active" : "");
    if (i === player.idx) c.scrollIntoView({ block: "nearest" });  // 再生中の節を常に見える位置に
  });
  document.getElementById("btnPlay").textContent =
    player.playing ? "⏸ 一時停止" : (player.idx >= player.phrases.length ? "▶ もう一度" : "▶ 再開");
}

function playerPlay() {
  speechSynthesis.cancel();
  if (player.idx >= player.phrases.length) player.idx = 0;
  player.playing = true;
  const gen = ++player.gen;
  const speakNext = () => {
    if (gen !== player.gen || !player.playing) return;
    if (player.idx >= player.phrases.length) { player.playing = false; playerRender(); return; }
    playerRender();
    const u = makeUtter(player.phrases[player.idx]);
    u.onend = () => { if (gen === player.gen && player.playing) { player.idx++; speakNext(); } };
    speechSynthesis.speak(u);
  };
  speakNext();
}

function playerPlayOne(i) {
  // 節を単発で発音（続きへは進まない）。▶再開を押せばこの節から通し再生
  player.playing = false;
  player.gen++;
  speechSynthesis.cancel();
  player.idx = i;
  playerRender();
  speechSynthesis.speak(makeUtter(player.phrases[i]));
}

function playerPause() {
  player.playing = false; player.gen++;
  speechSynthesis.cancel();  // 現在の節の頭から再開できるようidxは保持
  playerRender();
}

function playerToggle() { player.playing ? playerPause() : playerPlay(); }
function playerRestart() { player.idx = 0; playerPlay(); }
function playerStop() { player.playing = false; player.gen++; }
function playerClose() {
  playerPause();
  document.getElementById("player").style.display = "none";
  document.body.style.paddingBottom = "";
}

const TONE_MARKS = { a:"āáǎà", e:"ēéěè", i:"īíǐì", o:"ōóǒò", u:"ūúǔù", "ü":"ǖǘǚǜ" };
const TONE_LABEL = ["ˉ", "ˊ", "ˇ", "ˋ"];

function pyOne(syl, tone) {
  let s = (syl || "").replace(/v/g, "ü");
  if (!(tone >= 1 && tone <= 4)) return s;
  let tgt = null, idx = -1;
  if (s.includes("a")) { tgt = "a"; idx = s.indexOf("a"); }
  else if (s.includes("o")) { tgt = "o"; idx = s.indexOf("o"); }
  else if (s.includes("e")) { tgt = "e"; idx = s.indexOf("e"); }
  else if (s.includes("iu")) { tgt = "u"; idx = s.indexOf("iu") + 1; }
  else if (s.includes("ui")) { tgt = "i"; idx = s.indexOf("ui") + 1; }
  else {
    for (let i = s.length - 1; i >= 0; i--) if ("iuü".includes(s[i])) { tgt = s[i]; idx = i; break; }
  }
  if (!tgt) return s;
  return s.slice(0, idx) + TONE_MARKS[tgt][tone - 1] + s.slice(idx + 1);
}

function pyFull(w) { return w.py.map(p => pyOne(p[0], p[1])).join(" "); }

function gmShuffle(a) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; }
  return x;
}

function gameStart(mode) {
  let pool = GAME_DECK.slice();
  if (mode === "cloze") pool = pool.filter(w => (w.ex || []).length);
  if (mode === "build") pool = pool.filter(w => w.zh.length >= 2);
  // 苦手な語を優先的に混ぜる
  const weak = gameWeak().map(x => x.zh);
  const w1 = gmShuffle(pool.filter(w => weak.includes(w.zh)));
  const w2 = gmShuffle(pool.filter(w => !weak.includes(w.zh)));
  gm = { mode, q: 0, total: Math.min(10, pool.length), score: 0, combo: 0, best: 0,
         items: w1.concat(w2).slice(0, Math.min(10, pool.length)),
         cur: null, miss: [], locked: false, step: 0, built: "" };
  document.getElementById("gmMenu").style.display = "none";
  document.getElementById("gmResult").style.display = "none";
  document.getElementById("gmPlay").style.display = "";
  gameNext();
}

function gameHead() {
  document.getElementById("gmCount").textContent = `${Math.min(gm.q + 1, gm.total)}/${gm.total}`;
  document.getElementById("gmProg").style.width = (gm.q / gm.total * 100) + "%";
  document.getElementById("gmScore").innerHTML =
    gm.score + (gm.combo >= 2 ? ` <span class="gmcombo">${gm.combo}連続</span>` : "");
}

function gameNext() {
  if (gm.q >= gm.total) return gameResult();
  gm.cur = gm.items[gm.q];
  gm.locked = false; gm.step = 0; gm.built = "";
  document.getElementById("gmFb").textContent = "";
  document.getElementById("gmFb").className = "gmfb";
  gameHead();
  ({ tone: qTone, ear: qEar, build: qBuild, cloze: qCloze })[gm.mode]();
}

function gameScore(ok, w) {
  if (ok) {
    gm.combo++; gm.best = Math.max(gm.best, gm.combo);
    gm.score += 10 + Math.max(0, (gm.combo - 1) * 2);
  } else {
    gm.combo = 0; gm.miss.push(w); gameSaveMiss(w);
  }
  gameHead();
}

function gameFb(ok, text) {
  const fb = document.getElementById("gmFb");
  fb.className = "gmfb " + (ok ? "ok" : "ng");
  fb.textContent = text;
}

function gameAdvance(ms) {
  gm.locked = true;
  setTimeout(() => { gm.q++; gameNext(); }, ms || 1100);
}

// --- A 声調アタック ---
function qTone() {
  const w = gm.cur;
  const body = document.getElementById("gmBody");
  body.innerHTML =
    `<div class="gmword" id="gmTw">${w.zh.split("").map((c, i) =>
      `<span id="gmTc${i}" class="${i === 0 ? "now" : ""}">${esc(c)}</span>`).join("")}</div>` +
    `<div class="gmpy" id="gmTp">${w.py.map(p => esc(p[0])).join(" ")}</div>` +
    `<div class="gmtones">${TONE_LABEL.map((t, i) =>
      `<button onclick="tapTone(${i + 1})">${t}<div class="sub">${i + 1}声</div></button>`).join("")}</div>`;
}

function tapTone(t) {
  if (gm.locked) return;
  const w = gm.cur, i = gm.step, right = w.py[i][1];
  const cell = document.getElementById("gmTc" + i);
  cell.classList.remove("now");
  cell.classList.add(t === right ? "done" : "ng");
  const next = i + 1;
  if (t !== right || next >= w.py.length) {   // 1つでも外したらその語は終わり
    const ok = (t === right);
    document.getElementById("gmTp").textContent = pyFull(w) + "  " + w.ja;
    gameScore(ok, w);
    gameFb(ok, ok ? "正解！" : `${pyFull(w)}（${w.ja}）`);
    speakZh(w.zh);
    return gameAdvance(ok ? 900 : 1600);
  }
  gm.step = next;
  const nx = document.getElementById("gmTc" + next);
  if (nx) nx.classList.add("now");
}

// --- B 耳から意味当て ---
function qEar() {
  const w = gm.cur;
  const wrong = gmShuffle(GAME_DECK.filter(x => x.zh !== w.zh && x.ja !== w.ja)).slice(0, 3);
  const ch = gmShuffle([w].concat(wrong));
  document.getElementById("gmBody").innerHTML =
    `<div style="text-align:center;margin:18px 0 6px">
       <button class="primary" style="font-size:30px;padding:16px 26px;border-radius:50%" onclick="speakZh('${w.zh}')">🔊</button>
     </div>
     <div class="gmpy" id="gmEp">？</div>
     <div class="gmchoices">${ch.map(c =>
       `<button onclick="tapEar('${c.zh}')">${esc(c.ja)}</button>`).join("")}</div>`;
  setTimeout(() => speakZh(w.zh), 250);
}

function tapEar(zh) {
  if (gm.locked) return;
  const w = gm.cur, ok = zh === w.zh;
  const btns = document.querySelectorAll("#gmBody .gmchoices button");
  btns.forEach(b => {
    if (b.textContent === w.ja) b.classList.add("ok");
    else if (b.getAttribute("onclick").includes("'" + zh + "'")) b.classList.add("ng");
  });
  document.getElementById("gmEp").textContent = `${w.zh}  ${pyFull(w)}`;
  gameScore(ok, w);
  gameFb(ok, ok ? "正解！" : `${w.zh}  ${pyFull(w)}  ${w.ja}`);
  gameAdvance(ok ? 1100 : 1700);
}

// --- C 合体パズル ---
function qBuild() {
  const w = gm.cur;
  const pool = w.zh.split("");
  const others = GAME_DECK.filter(x => x.zh !== w.zh).map(x => x.zh).join("").split("");
  const decoy = gmShuffle(others.filter(c => !pool.includes(c))).slice(0, Math.min(3, 7 - pool.length));
  const tiles = gmShuffle(pool.concat(decoy));
  document.getElementById("gmBody").innerHTML =
    `<div class="gmja">${esc(w.ja)}</div>
     <div class="gmslot" id="gmSlot">${"_ ".repeat(w.zh.length)}</div>
     <div class="gmpy" id="gmBp">${w.zh.length}文字</div>
     <div class="gmtiles" id="gmTiles">${tiles.map((c, i) =>
       `<button id="gmTi${i}" onclick="tapTile(${i},'${c}')">${esc(c)}</button>`).join("")}</div>
     <div class="row" style="justify-content:center;margin-top:10px">
       <button class="small ghost" onclick="undoTile()">⌫ 戻す</button></div>`;
}

function tapTile(i, c) {
  if (gm.locked) return;
  const w = gm.cur;
  if (gm.built.length >= w.zh.length) return;
  gm.built += c;
  const b = document.getElementById("gmTi" + i);
  if (b) { b.disabled = true; b.dataset.used = "1"; }
  document.getElementById("gmSlot").textContent = gm.built + " _".repeat(Math.max(0, w.zh.length - gm.built.length));
  if (gm.built.length === w.zh.length) {
    const ok = gm.built === w.zh;
    gameScore(ok, w);
    document.getElementById("gmBp").textContent = `${w.zh}  ${pyFull(w)}`;
    gameFb(ok, ok ? "正解！" : `正解は ${w.zh}（${pyFull(w)}）`);
    speakZh(w.zh);
    gameAdvance(ok ? 1100 : 1800);
  }
}

function undoTile() {
  if (gm.locked || !gm.built) return;
  const c = gm.built.slice(-1);
  gm.built = gm.built.slice(0, -1);
  const b = Array.from(document.querySelectorAll("#gmTiles button"))
    .reverse().find(x => x.disabled && x.textContent === c);
  if (b) b.disabled = false;
  document.getElementById("gmSlot").textContent =
    gm.built + " _".repeat(Math.max(0, gm.cur.zh.length - gm.built.length));
}

// --- E 記事で穴埋め ---
function qCloze() {
  const w = gm.cur;
  const s = w.ex[Math.floor(Math.random() * w.ex.length)];
  const masked = esc(s).split(esc(w.zh)).join("<u> </u>");
  const wrong = gmShuffle(GAME_DECK.filter(x => x.zh !== w.zh && x.zh.length === w.zh.length)).slice(0, 3);
  const ch = gmShuffle([w].concat(wrong.length >= 3 ? wrong :
    wrong.concat(gmShuffle(GAME_DECK.filter(x => x.zh !== w.zh)).slice(0, 3 - wrong.length))));
  document.getElementById("gmBody").innerHTML =
    `<div class="gmsent">${masked}</div>
     <div class="gmpy" id="gmCp"></div>
     <div class="gmchoices">${ch.map(c =>
       `<button onclick="tapCloze('${c.zh}')">${esc(c.zh)}</button>`).join("")}</div>`;
}

function tapCloze(zh) {
  if (gm.locked) return;
  const w = gm.cur, ok = zh === w.zh;
  document.querySelectorAll("#gmBody .gmchoices button").forEach(b => {
    if (b.textContent === w.zh) b.classList.add("ok");
    else if (b.textContent === zh) b.classList.add("ng");
  });
  document.getElementById("gmCp").textContent = `${pyFull(w)}  ${w.ja}`;
  document.querySelectorAll("#gmBody .gmsent u").forEach(u => u.textContent = w.zh);
  gameScore(ok, w);
  gameFb(ok, ok ? "正解！" : `${w.zh}  ${w.ja}`);
  gameAdvance(ok ? 1100 : 1800);
}

// --- 結果 ---
function gameResult() {
  document.getElementById("gmProg").style.width = "100%";
  document.getElementById("gmPlay").style.display = "none";
  const r = document.getElementById("gmResult");
  r.style.display = "";
  const okN = gm.total - gm.miss.length;
  const star = okN === gm.total ? "🏆 全問正解！" : okN >= gm.total * 0.8 ? "✨ good!" : "";
  document.getElementById("gmResTitle").textContent = `${gm.score}点  ${star}`;
  document.getElementById("gmResBody").innerHTML =
    `<div class="sub">正解 ${okN}/${gm.total}　最大コンボ ${gm.best}</div>` +
    (gm.miss.length ? `<h2 style="margin-top:12px">復習</h2>` + gm.miss.map(w =>
      `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #f0f0f0">
         <button class="small ghost" onclick="speakZh('${w.zh}')">🔊</button>
         <div><b style="font-size:18px">${esc(w.zh)}</b>
           <span class="sub" style="margin-left:6px">${esc(pyFull(w))}</span>
           <div class="sub">${esc(w.ja)}</div></div>
       </div>`).join("") : `<div style="margin-top:8px">間違いなし。次は速度を上げてみましょう。</div>`);
}

// ---- 通し読み（表示中の中国語を上から順に読み上げる） ----
// 対象は「拼音が振ってある中国語のかたまり」。記事＝本文と重要語彙、
// 会話＝各ターンと語彙、用語＝一覧の各行。伏せ字中のターンは読まない。
// 一時停止はブラウザ依存のpause()を使わず、位置を覚えて止める方式。
// （iOSのpause()は復帰しないことがあるため。再開はその行の頭から）
const READ_SEL = {
  articles: "#artSentences .cgrid, #artVocab .cgrid",
  dialog: "#dlgTurns .cgrid, #dlgVocab .cgrid",
  gloss: "#glList [data-zh]",
};
let reading = false, readPaused = false, readGen = 0, readIdx = 0;
let readLoop = localStorage.getItem("readLoop") === "1";
let readRate = parseFloat(localStorage.getItem("readRate") || "1") || 1;

function readTargets() {
  const sel = READ_SEL[view];
  if (!sel) return [];
  return Array.from(document.querySelectorAll(sel))
    .filter(el => !el.classList.contains("masked") && readText(el));
}

function readText(el) {
  if (el.dataset.zh) return el.dataset.zh;
  return Array.from(el.querySelectorAll(".cchar"))
    .map(c => c.dataset.ch || "").join("").trim();
}

// 読んでいる行を画面の上から25%の位置へ
function readScroll(el) {
  const y = window.scrollY + el.getBoundingClientRect().top - window.innerHeight * 0.25;
  window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
}

function readSpeak(text) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = readRate;
    const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("zh"));
    if (vs.length) u.voice = vs.find(v => /Tingting|Ting-Ting|Chinese|中文|普通话/i.test(v.name)) || vs[0];
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
  });
}

function readWait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function readMark(el) {
  document.querySelectorAll(".reading").forEach(e => e.classList.remove("reading"));
  if (el) el.classList.add("reading");
}

function readBtnSync(n) {
  const b = document.getElementById("btnReadAll");
  if (b) b.textContent = reading ? "⏸ 一時停止" : (readPaused ? "▶ 続きから" : "▶ 通し読み");
  const st = document.getElementById("btnReadStop");
  if (st) st.style.display = (reading || readPaused) ? "" : "none";
  const p = document.getElementById("readPos");
  if (p && n !== undefined) p.textContent = n;
}

function readRateChanged(v) {
  readRate = parseFloat(v) || 1;
  localStorage.setItem("readRate", String(readRate));
  // 再生中なら、今読んでいる行から新しい速度で読み直す
  if (reading) { readPause(); readStart(); }
}

function readLoopToggle() {
  readLoop = !readLoop;
  localStorage.setItem("readLoop", readLoop ? "1" : "0");
  document.getElementById("btnReadLoop").classList.toggle("active", readLoop);
}

// 一時停止：位置（readIdx）は残す。再開するとその行の頭から
function readPause() {
  readGen++;
  reading = false;
  readPaused = true;
  speechSynthesis.cancel();
  readBtnSync();
}

// 停止：先頭に戻す
function readStop() {
  readGen++;
  reading = false;
  readPaused = false;
  readIdx = 0;
  speechSynthesis.cancel();
  readMark(null);
  readBtnSync("");
}

function readToggle() {
  if (reading) { readPause(); return; }
  readStart();
}

async function readStart() {
  const list0 = readTargets();
  if (!list0.length) return;
  try { playerStop(); } catch (e) {}
  speechSynthesis.cancel();
  reading = true;
  readPaused = false;
  const gen = ++readGen;
  readBtnSync();
  do {
    const list = readTargets();   // ループ2周目以降も最新のDOMを見る
    if (!list.length) break;
    if (readIdx >= list.length) readIdx = 0;
    for (; readIdx < list.length; readIdx++) {
      if (gen !== readGen) return;
      const el = list[readIdx];
      readMark(el);
      readScroll(el);
      readBtnSync(`${readIdx + 1}/${list.length}`);
      await readSpeak(readText(el));
      if (gen !== readGen) return;
      await readWait(180);
      if (gen !== readGen) return;
    }
    readIdx = 0;
    if (readLoop) await readWait(700);
  } while (readLoop && gen === readGen);
  if (gen === readGen) readStop();
}

// 読み上げ対象がある画面でだけバーを出す（どの経路で描画されても追従できるよう定期確認）
function readBarSync() {
  const bar = document.getElementById("readBar");
  if (!bar) return;
  const show = !!READ_SEL[view] && readTargets().length > 0;
  bar.style.display = show ? "flex" : "none";
  document.getElementById("btnReadLoop").classList.toggle("active", readLoop);
  if (!show && (reading || readPaused)) readStop();
}
setInterval(readBarSync, 800);

(function initReadRate() {
  const s = document.getElementById("readRate");
  if (s) s.value = String(readRate);
  readBtnSync("");
})();

// 通し読みの音声をMP3で落とす（Azureの音声合成を使うのでネット接続が要る）
function readName() {
  const id = (typeof curArticle === "object" && curArticle ? curArticle.id || "" : "")
    .replace(/[^A-Za-z0-9_-]/g, "");
  if (view === "articles") return "article_" + id.slice(0, 12);
  if (view === "dialog") return "dialog_" + id.slice(0, 20);
  const i = GL_CATS.indexOf(glCat);
  return "glossary" + (i >= 0 ? "_cat" + (i + 1) : "");
}

async function readDownload() {
  const lines = readTargets().map(readText).filter(Boolean);
  if (!lines.length) return;
  const btn = document.getElementById("btnReadDl");
  btn.disabled = true;
  btn.textContent = "⏳";
  try {
    const r = await fetch("/api/tts", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lines, lang: "zh", name: readName(), rate: readRate }),
    });
    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try { msg = (await r.json()).error || msg; } catch (e) {}
      throw new Error(msg);
    }
    const cd = r.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = m ? m[1] : "read.mp3";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  } catch (e) {
    alert("音声ファイルを作れませんでした: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "⬇️";
  }
}

// ---- 専門用語集（分類別／Notionと同期） ----
const GL_CATS = ["ロボット本体・種別","モーター・駆動","減速・伝動・機構","センサー・知覚",
  "AI・制御","材料・構造・熱","製造・量産","規格・安全","サプライチェーン","資本・市場",
  "固有名詞","一般"];
let glCat = "", glQ = "", glTimer = null;
let glGeneral = localStorage.getItem("glGeneral") === "1";

function speakZh(text) {
  try { playerStop(); } catch (e) {}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = parseFloat(document.getElementById("rate").value);
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("zh"));
  if (vs.length) u.voice = vs.find(v => /Tingting|Ting-Ting|Chinese|中文|普通话/i.test(v.name)) || vs[0];
  speechSynthesis.speak(u);
}

function glToggleGeneral(on) {
  glGeneral = on;
  localStorage.setItem("glGeneral", on ? "1" : "0");
  if (!on && glCat === "一般") glCat = "";
  loadGloss();
}

function glSearch(v) {
  glQ = v;
  if (v) glCat = "";  // 検索中は分類の絞り込みを解除（取りこぼし防止）
  clearTimeout(glTimer);
  glTimer = setTimeout(loadGloss, 250);
}

function glPick(cat) {
  glCat = (glCat === cat) ? "" : cat;
  loadGloss();
}

async function loadGloss() {
  document.getElementById("glGen").checked = glGeneral;
  const qs = new URLSearchParams({ cat: glCat, q: glQ,
    general: glGeneral ? "1" : "0", limit: "300" });
  try {
    const d = await api("/api/glossary?" + qs.toString());
    renderGloss(d);
  } catch (e) {
    document.getElementById("glList").textContent = e.message;
  }
}

function renderGloss(d) {
  const cats = d.cats.filter(c => glGeneral || c.name !== "一般");
  document.getElementById("glCats").innerHTML = cats.map(c =>
    `<button class="tab small ${glCat === c.name ? "active" : ""}"
      onclick="glPick('${c.name}')">${esc(c.name)} <span class="sub">${c.n}</span></button>`).join("");
  const opts = GL_CATS.map(c => `<option value="${c}">${c}</option>`).join("");
  document.getElementById("glCount").textContent =
    `${d.matched}件 / 全${d.total}件` + (d.items.length < d.matched ? `（上位${d.items.length}件）` : "");
  document.getElementById("glList").innerHTML = d.items.length ? d.items.map(it => `
    <div data-zh="${esc(it.zh)}" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0">
      <div style="flex:1;min-width:0">
        <div onclick="speakZh('${it.zh.replace(/'/g, "")}')" style="cursor:pointer">
          <b style="font-size:17px">${esc(it.zh)}</b>
          <span class="sub" style="margin-left:6px">${esc(it.py)}</span>
        </div>
        <div class="sub" style="color:var(--muted)">${esc(it.ja)}</div>
      </div>
      <span class="badge" title="出現回数">${it.freq}</span>
      <select onchange="glSetCat('${it.zh.replace(/'/g, "")}', this.value)"
        style="max-width:40vw">${opts.replace(`value="${it.cat}"`, `value="${it.cat}" selected`)}</select>
    </div>`).join("") : "<div class=\"sub\">該当なし</div>";
}

async function glSetCat(zh, cat) {
  try {
    await api("/api/glossary/cat", { zh, cat });
    loadGloss();
  } catch (e) { alert(e.message); }
}

function glMsg(t) { document.getElementById("msgGloss").textContent = t; }

async function glPull() {
  glMsg("Notionから取り込み中…");
  try {
    const d = await api("/api/glossary/pull", {});
    glMsg(`Notion ${d.notion_rows}件 → 追加${d.added} / 更新${d.updated}（合計${d.total}語）`);
    loadGloss();
  } catch (e) { glMsg("取り込み失敗: " + e.message); }
}

async function glPush() {
  if (!confirm("ローカルの分類をNotionへ書き戻します（Notionに無い語は新規作成）。実行しますか？")) return;
  try {
    await api("/api/glossary/push", { create_missing: true });
    glMsg("Notionへ書き戻し中…");
    glPoll();
  } catch (e) { glMsg("書き戻し失敗: " + e.message); }
}

async function glPoll() {
  try {
    const s = await api("/api/glossary/push");
    const n = `${s.done}/${s.total || "?"}（新規${s.created} 更新${s.updated} 据置${s.skipped}）`;
    if (s.running) { glMsg("Notionへ書き戻し中… " + n); setTimeout(glPoll, 2000); return; }
    glMsg((s.error ? "エラー: " + s.error + " / " : "") + "書き戻し完了 " + n +
      (s.errors && s.errors.length ? ` 失敗${s.errors.length}件: ${s.errors[0]}` : ""));
  } catch (e) { glMsg("状況取得に失敗: " + e.message); }
}

// ---- 記録（発音チェックの履歴と苦手） ----
let recLang = "zh", recTab = "weak";

function setRecLang(l) {
  recLang = l;
  document.getElementById("rlang_en").classList.toggle("active", l === "en");
  document.getElementById("rlang_zh").classList.toggle("active", l === "zh");
  loadRecord();
}

function setRecTab(t) {
  recTab = t;
  document.getElementById("rtab_weak").classList.toggle("active", t === "weak");
  document.getElementById("rtab_hist").classList.toggle("active", t === "hist");
  loadRecord();

async function clearRecords() {

function weakTable(list) {
  let h = `<table class="htable wtbl"><tr>
    <th>語</th><th>ミスの種類</th><th>ミス(30日)</th><th>最終</th></tr>`;
  list.forEach(w => {

    if (w.kind) {
      const ch = w.kind_char
        ? `<span style="font-size:16px">${esc(w.kind_char)}</span> ` : "";
      const detail = w.expected_py && w.heard
        ? `<div class="sub">${ch}${esc(w.expected_py)} → ${esc(w.heard)}${w.heard_char ? "（" + esc(w.heard_char) + "）" : ""}</div>`
        : (w.heard ? `<div class="sub">→${esc(w.heard)}</div>` : "");
      kind = `<b>${esc(w.kind.code)}</b> ${esc(w.kind.label)}${detail}`;
    } else if (w.weak) {
      kind = `<span class="sub">${esc(w.weak.name)} ${w.weak.score}点</span>`;
    }
    h += `<tr>
      <td><span class="wword">${label}</span>

      <td class="sub" style="white-space:nowrap">${(w.last || "").slice(5)}</td></tr>`;

  return h + "</table>";
}

function histTable(list) {
  let h = `<table class="htable"><tr><th>日時</th><th>文</th><th>総合</th></tr>`;
  list.forEach(a => {

}

function renderHistory() {
  const q = (document.getElementById("hFilter").value || "").toLowerCase();
  const fs = allS.filter(s => !q || (s.english + " " + s.japanese).toLowerCase().includes(q));
  const fw = allW.filter(w => !q || (w.word + " " + w.meaning + " " + w.example).toLowerCase().includes(q));
  const box = document.getElementById("history");
  let h = "";
  if (histTab === "sent") {
    h = sentTable(fs, true) || "該当なし";
  } else if (histTab === "word") {
    h = wordTable(fw, true) || "該当なし";
  } else {
    const dates = [...new Set([...fs.map(s => s.created), ...fw.map(w => w.created)])]
      .sort().reverse();
    dates.forEach(d => {
      const ds = fs.filter(s => s.created === d), dw = fw.filter(w => w.created === d);
      h += `<div class="dateh">${d}</div>`;
      if (ds.length) h += `<div class="seclabel">${L().unit} ${ds.length}件</div>` + sentTable(ds, false);
      if (dw.length) h += `<div class="seclabel">単語 ${dw.length}語</div>` + wordTable(dw, false);
    });
    h = h || "該当なし";
  }
  box.innerHTML = h;
}
