# Supabase Free プランの一時停止対策（週1回 REST を叩く）
name: keepalive
on:
  schedule:
    - cron: "0 3 * * 1"   # 毎週月曜 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
